[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ticltune"
version = "0.1.0"
description = "Truth-based metrics and a CLUEstering emulator for tuning TICL trackster building"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "awkward", "uproot"]

[project.optional-dependencies]
tests = ["pytest"]

[project.scripts]
ticltune = "ticltune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
